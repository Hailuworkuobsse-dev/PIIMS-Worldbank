name: Frontend verification

on:
  push:
    branches: [main, "fix/frontend-typescript-errors"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-verification.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-verification.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
