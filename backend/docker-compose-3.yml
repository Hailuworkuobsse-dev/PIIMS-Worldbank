version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: piims-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: piims
      MYSQL_USER: piims
      MYSQL_PASSWORD: piims
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=caching_sha2_password
      --max_connections=200
      --innodb-buffer-pool-size=512M
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backups/mysql:/backups
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-padmin']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: piims-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: piims-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: piims-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb -p local/piims-dev || true &&
      mc anonymous set download local/piims-dev/public || true &&
      echo 'MinIO bucket initialized';
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piims-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      API_BASE_PATH: /v1
      CORS_ORIGINS: 'http://localhost:5173,http://localhost:4173'
      DATABASE_URL: 'mysql://root:admin@mysql:3306/piims'
      REDIS_URL: 'redis://redis:6379/0'
      JWT_SECRET: 'dev-only-secret-32-chars-minimum-please-change-me'
      JWT_REFRESH_SECRET: 'dev-refresh-32-chars-minimum-please-change-me-too'
      JWT_ACCESS_EXPIRES_IN: '15m'
      JWT_REFRESH_EXPIRES_IN: '8h'
      LOG_LEVEL: info
      LOG_PRETTY: 'true'
      S3_ENDPOINT: 'http://minio:9000'
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: piims-dev
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/main.js']

volumes:
  mysql-data:
  redis-data:
  minio-data: