name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.0'

jobs:
  quality:
    name: Lint · Typecheck · Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run --reporter=verbose

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: piims_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -padmin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'mysql://root:admin@localhost:3307/piims_test'
      - run: npm run prisma:seed
        env:
          DATABASE_URL: 'mysql://root:admin@localhost:3307/piims_test'

      - name: Build
        run: npm run build

      - name: Run E2E tests
        env:
          NODE_ENV: test
          DATABASE_URL: 'mysql://root:admin@localhost:3307/piims_test'
          REDIS_URL: 'redis://localhost:6379/0'
          JWT_SECRET: 'test-secret-at-least-32-chars-long-aaaa'
          JWT_REFRESH_SECRET: 'test-refresh-at-least-32-chars-long-bbbb'
          S3_ACCESS_KEY: 'minio'
          S3_SECRET_KEY: 'minio123'
          S3_BUCKET: 'piims-test'
          S3_ENDPOINT: 'http://localhost:9000'
          S3_REGION: 'us-east-1'
          LOG_LEVEL: 'silent'
        run: npm run test:e2e

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: piims-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max